version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo "diag-build-env-present-count=$(env | grep -c -e ^FEDERATED_AUTH_ENABLED= -e ^GOOGLE_OAUTH_CLIENT_ID= -e ^GOOGLE_OAUTH_CLIENT_SECRET=)"
        - env | grep -e AVATAR_BUCKET_NAME -e AVATAR_PUBLIC_BASE_URL -e PASSWORD_RESET_FROM_EMAIL -e FEDERATED_AUTH_ENABLED -e GOOGLE_OAUTH_CLIENT_ID -e GOOGLE_OAUTH_CLIENT_SECRET -e OAUTH_TOKEN_ENCRYPTION_KEY >> .env.production
        - echo "diag-env-production-line-count=$(wc -l < .env.production)"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
