version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Nonsecret references/flags only. Runtime secrets use the SSR compute
        # role + approved Secrets Manager entry, never deployment artifacts.
        - node scripts/write-amplify-runtime-env.mjs --write
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
